services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - mlflow_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow", "-d", "mlflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1-full
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "5000"

    volumes:
      - mlflow_artifacts:/opt/mlflow/data

    environment:
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI:?Set MLFLOW_BACKEND_STORE_URI in Dokploy}
      MLFLOW_AUTH_CONFIG_PATH: ${MLFLOW_AUTH_CONFIG_PATH:?Set MLFLOW_AUTH_CONFIG_PATH in Dokploy}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:?Set MLFLOW_FLASK_SERVER_SECRET_KEY in Dokploy}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:?Set MLFLOW_ADMIN_PASSWORD in Dokploy}
      MLFLOW_ENABLE_WORKSPACES: ${MLFLOW_ENABLE_WORKSPACES:-true}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:?Set MLFLOW_ALLOWED_HOSTS in Dokploy}
      MLFLOW_CORS_ALLOWED_ORIGINS: ${MLFLOW_CORS_ALLOWED_ORIGINS:?Set MLFLOW_CORS_ALLOWED_ORIGINS in Dokploy}

    command:
      - /bin/sh
      - -ec
      - |
        umask 077

        cat > "$${MLFLOW_AUTH_CONFIG_PATH}" <<EOF
        [mlflow]
        default_permission = READ
        database_uri = $${MLFLOW_BACKEND_STORE_URI}
        admin_username = admin
        admin_password = $${MLFLOW_ADMIN_PASSWORD}
        authorization_function = mlflow.server.auth:authenticate_request_basic_auth
        grant_default_workspace_access = false
        workspace_cache_max_size = 10000
        workspace_cache_ttl_seconds = 3600
        EOF

        unset MLFLOW_ADMIN_PASSWORD

        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --artifacts-destination /opt/mlflow/data/artifacts \
          --default-artifact-root mlflow-artifacts:/ \
          --app-name basic-auth \
          --allowed-hosts "$${MLFLOW_ALLOWED_HOSTS}" \
          --cors-allowed-origins "$${MLFLOW_CORS_ALLOWED_ORIGINS}"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mlflow_postgres:
  mlflow_artifacts: