[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfix-mlflow-integration"
version = "0.1.0"
description = "Shared MLflow integration helpers for the HPI DeepFix pilot project"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["deepfix_mlflow*"]
