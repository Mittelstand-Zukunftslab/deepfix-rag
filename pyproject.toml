[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "deepfix_rag"
version = "0.1.0"
description = "Automated optimization of RAG workflow using long-running agents"
authors = [
  { name = "Mittelstand Zukunftslab & AI Service Center - HPI" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "datasets>=2.14.0",
    "deepeval>=1.0.0",
    "lancedb>=0.37.1,<0.38.0",
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-openai>=0.2.0",
    "llama-index-llms-litellm>=0.2.0",
    "llama-index-postprocessor-cohere-rerank>=0.2.0",
    "llama-index-vector-stores-lancedb>=0.2.0",
    "litellm>=1.0.0",
    "loguru",
    "mlflow>=3",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0.0",
    "pyarrow>=14.0.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "rich",
    "ruff",
    "tiktoken>=0.5.0",
    "typer>=0.9.0",
    "turbovec[llama-index]>=1.0.0",
    "llama-index-llms-openai>=0.8.1",
    "llama-index-graph-stores-falkordb>=0.7.0",
    "llama-index-graph-stores-memgraph>=0.6.0",
    "llama-index-retrievers-bm25>=0.8.0",
    "pystemmer>=2.2.0.3",
    "python-terrier>=1.0",
    "pyterrier>=1.1.2",
    "optuna>=5.0.0",
    "deepfix-sdk[ir]",
    "fasttext-wheel>=0.9.2",
    "seqeval>=1.2.2",
    "numpy<2",
    "textblob>=0.20.1",
    "numba>=0.67.0",
    "umap-learn>=0.5.12",
    "chonkie==1.3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.32",
]
requires-python = "~=3.12.0"

[project.scripts]
deepfix = "deepfix_rag.main:app"
deepfix-rag = "deepfix_rag.main:app"


[tool.ruff]
line-length = 99
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "scripts/hermes_runner.py"]


[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["B008", "E501"]  # Allow Typer defaults and long docstrings/lines

[tool.ruff.lint.isort]
known-first-party = ["deepfix_rag"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "unit: Unit tests with no external network or heavy dependencies",
    "cli: CLI command interaction tests",
    "integration: Integration tests requiring filesystem or multi-component workflows",
    "e2e: End-to-end pipeline execution tests requiring live embedding/LLM backends",
    "network: Tests that download datasets or interact with remote APIs",
    "api: FastAPI product API route, schema, and OpenAPI contract tests",
]

[tool.uv.sources]
deepfix-sdk = { git = "https://github.com/delcaux-labs/deepfix.git", subdirectory = "packages/deepfix-sdk" }


