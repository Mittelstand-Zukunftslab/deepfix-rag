[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "deepfix_rag"
version = "0.1.0"
description = "Automated optimization of RAG workflow using long-running agents"
authors = [
  { name = "Mittelstand Zukunftslab & AI Service Center - HPI" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "pydantic>=2.0",
    "pytest",
    "python-dotenv",
    "rich",
    "ruff",
    "typer>=0.9.0",
]
requires-python = "~=3.12.0"

[project.scripts]
deepfix = "deepfix_rag.main:app"
deepfix-rag = "deepfix_rag.main:app"


[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting
ignore = ["B008"]  # Allow function calls in argument defaults (standard for Typer)

[tool.ruff.lint.isort]
known-first-party = ["deepfix_rag"]
force-sort-within-sections = true

