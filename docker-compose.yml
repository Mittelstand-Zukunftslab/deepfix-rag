# Local services for DeepFix.
# Credentials are read from .env (see example.env):
#   MEMGRAPH_USERNAME, MEMGRAPH_PASSWORD
#   FALKORDB_PASSWORD
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   API_SERVER_KEY, OPENROUTER_API_KEY, HERMES_CHAT_API_SERVER_KEY
#   OPTIMIZATION_AGENT, HERMES_BASE_URL
#   HERMES_S3_ACCESS_KEY_ID, HERMES_S3_SECRET_ACCESS_KEY
#   MLFLOW_BACKEND_STORE_URI,
#   MLFLOW_SERVER_ALLOWED_HOSTS, MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
#   MLFLOW_PUBLIC_HOST, MLFLOW_BASIC_AUTH_USERS
#   MLFLOW_DEV_RAG_EXPERIMENT
#   RUSTFS_CONSOLE_ENABLE
#   DEEPFIX_SERVER_DATABASE_URL
#   BETTER_AUTH_SECRET, WEB_ORIGIN, API_INTERNAL_URL, AUTH_JWKS_URL, ALLOWED_EMAIL_DOMAINS
#   LLM_API_KEY, EMBEDDING_API_KEY, COHERE_API_KEY
#   LLM_MODEL, LLM_JUDGE_MODEL, EMBEDDING_MODEL, COHERE_MODEL
#   HERMES_MODEL, HERMES_MODEL_PROVIDER
#   DEEPFIX_LLM_MODEL_NAME
#
#   docker compose up -d

include:
  - compose.hermes.yml
  - compose.graphdb.yml

services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    # No published ports. The S3 API and the console are reachable only from
    # the Compose network, so every caller uses S3_ENDPOINT_URL=http://rustfs:9000
    # and no request leaves the host. See "MLflow and RustFS lockdown" in
    # README.md before re-adding a port.
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      # The console has no consumer in this repository and is the only
      # full-control surface with no IAM policy in front of it, so it is off by
      # default. Set RUSTFS_CONSOLE_ENABLE=true only on a private network, and
      # rebuild this service alone.
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    mem_limit: 1G
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - "http://127.0.0.1:9000/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: mlflow
    # No published port. MLflow has no authentication of its own, so the only
    # safe way to run it is to keep it off the internet. Every machine caller
    # (backend-api, hermes, diagnostic-agent) reaches it at
    # MLFLOW_TRACKING_URI=http://mlflow:5000 over the Compose network.
    #
    # A human reads the UI through exactly one router defined here, which
    # terminates TLS and requires the `deepfix-mlflow-auth` basic-auth
    # middleware. The router lives in this file rather than in Dokploy so the
    # middleware cannot be detached by a redeploy.
    #
    # Remove the Dokploy Domain entry for the `mlflow` service: it would create a
    # second, unauthenticated router for the same Host. The priority below keeps
    # that failure safe instead of silent, because this router wins the tie and
    # the request is still challenged, but a lone authenticated router is the
    # intended state.
    #
    # Because Dokploy only attaches a service to dokploy-network when that
    # service has a Domain, and this router replaces the Domain, the service
    # joins the network itself below. `traefik.docker.network` says which of its
    # two networks Traefik should dial, so the router cannot resolve the
    # container's `default`-network address instead.
    #
    # Two values fail closed. Empty MLFLOW_BASIC_AUTH_USERS is never read as
    # "no auth": with no entries nobody authenticates, so Traefik refuses every
    # request to the router. An unset MLFLOW_PUBLIC_HOST leaves the rule on the
    # reserved `mlflow.invalid`, which matches no real request. Either way the
    # UI does not open. backend-api, hermes, and diagnostic-agent are unaffected
    # because they use mlflow:5000 inside the Compose network. Set both
    # variables and redeploy to open the UI.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.mlflow.loadbalancer.server.port=5000"
      - "traefik.http.routers.deepfix-mlflow.rule=Host(`${MLFLOW_PUBLIC_HOST:-mlflow.invalid}`)"
      - "traefik.http.routers.deepfix-mlflow.priority=1000"
      - "traefik.http.routers.deepfix-mlflow.service=mlflow"
      - "traefik.http.routers.deepfix-mlflow.entrypoints=websecure"
      - "traefik.http.routers.deepfix-mlflow.tls=true"
      - "traefik.http.routers.deepfix-mlflow.tls.certresolver=letsencrypt"
      - "traefik.http.routers.deepfix-mlflow.middlewares=deepfix-mlflow-auth"
      - "traefik.http.middlewares.deepfix-mlflow-auth.basicauth.users=${MLFLOW_BASIC_AUTH_USERS:-}"
    networks:
      - default
      - dokploy-network
    volumes:
      - mlflow_artifacts:/opt/mlflow/data
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////opt/mlflow/data/mlflow.db
      # MLflow 3.x matches the Host header exactly (hostname and hostname:port
      # are different entries). Setting this replaces the localhost defaults.
      MLFLOW_SERVER_ALLOWED_HOSTS: "${MLFLOW_SERVER_ALLOWED_HOSTS:-hermes,localhost,diagnostic-agent,mlflow,mlflow:5000,localhost:5000,127.0.0.1,127.0.0.1:5000,backend-api,deepfix-mlflow.mittelstand-zukunftslab.de}"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "${MLFLOW_SERVER_CORS_ALLOWED_ORIGINS:-http://hermes,http://localhost,http://diagnostic-agent,http://mlflow:5000,http://backend-api:8000,https://deepfix-mlflow.mittelstand-zukunftslab.de}"
    mem_limit: 2G
    command: mlflow server --host 0.0.0.0 --port 5000 --workers 1 --artifacts-destination /opt/mlflow/data/artifacts --default-artifact-root mlflow-artifacts:/
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  diagnostic-agent:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    container_name: diagnostic-agent
    ports:
      - "8844:8844"
    environment:
      DEEPFIX_LLM_API_KEY: ${DEEPFIX_LLM_API_KEY:-}
      DEEPFIX_LLM_BASE_URL: ${DEEPFIX_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      # The diagnostic server's own model. No default here: example.env sets it.
      DEEPFIX_LLM_MODEL_NAME: ${DEEPFIX_LLM_MODEL_NAME:-}
      DEEPFIX_LLM_TEMPERATURE: ${DEEPFIX_LLM_TEMPERATURE:-0.7}
      DEEPFIX_LLM_MAX_TOKENS: ${DEEPFIX_LLM_MAX_TOKENS:-8000}
      DEEPFIX_LLM_CACHE: ${DEEPFIX_LLM_CACHE:-1}
      DEEPFIX_LLM_TRACK_USAGE: ${DEEPFIX_LLM_TRACK_USAGE:-1}
      # The diagnostic server does not import this package. LiteLLM reads its own flag.
      DEEPFIX_LLM_DROP_PARAMS: ${DEEPFIX_LLM_DROP_PARAMS:-1}
      LITELLM_DROP_PARAMS: ${DEEPFIX_LLM_DROP_PARAMS:-1}
      DEEPFIX_SEARCH_PROVIDER: ${DEEPFIX_SEARCH_PROVIDER:-duckduckgo}
      NUM_REASONING_CHAINS: ${NUM_REASONING_CHAINS:-1}
      DEEPFIX_SERVER_DATABASE_URL: ${DEEPFIX_SERVER_DATABASE_URL:-sqlite:////root/.deepfix/deepfix_server.db}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXP_NAME: ${MLFLOW_EXP_NAME:-Deepfix-diagnostic-agent}
      UV_TOOL_BIN_DIR: /root/.local/bin
    volumes:
      - deepfix_tool_data:/root/.local
      - deepfix_server_data:/root/.deepfix
    depends_on:
      mlflow:
        condition: service_healthy
    mem_limit: 1G
    command:
      - /bin/bash
      - -ec
      - |
        export PATH="/root/.local/bin:$${PATH}"
        if ! command -v deepfix-server >/dev/null 2>&1; then
          echo "==> Installing deepfix-server tool via uv..."
          uv tool install --torch-backend cpu "git+https://github.com/delcaux-labs/deepfix.git#subdirectory=packages/deepfix-server"
        fi
        mkdir -p /root/.deepfix
        echo "==> Starting deepfix-server on 0.0.0.0:8844..."
        exec deepfix-server launch -host 0.0.0.0 -port 8844
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - "http://127.0.0.1:8844/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepfix-api
    container_name: deepfix-api
    # No published port. Traefik reaches this container on 8000 over its own
    # Docker network, so nothing on the host can reach the API except through a
    # router that terminates TLS and authenticates. The load-balancer port is a
    # label because there is no published port for Traefik to infer it from.
    # Dokploy supplies the router and its `Host` rule; see "Published ports" in
    # README.md before re-adding a port mapping.
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.backend-api.loadbalancer.server.port=8000"
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://web:8080}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://web:8080/api/auth/jwks}
      # Console level for the deepfix_rag and apscheduler loggers on stdout.
      DEEPFIX_LOG_LEVEL: ${DEEPFIX_LOG_LEVEL:-INFO}
      PRODUCT_DATA_DIR: /data/product
      WORKSPACE_DIR: /data/workspace
      MEMGRAPH_URL: bolt://memgraph:7687
      MEMGRAPH_USERNAME: ${MEMGRAPH_USERNAME:-neo4j}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:-neo4j}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: ${FALKORDB_PORT:-6379}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://rustfs:9000}
      S3_URI: ${S3_URI:-s3://deepfix-index/dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_DEV_RAG_EXPERIMENT: ${MLFLOW_DEV_RAG_EXPERIMENT:-dev_rag_experiment}
      DEEPFIX_SERVER_URL: ${DEEPFIX_SERVER_URL:-http://diagnostic-agent:8844}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      # Model ids come from .env. There is no code default: `deepfix eval` and
      # the judge fail naming the variable when it is empty.
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_JUDGE_MODEL: ${LLM_JUDGE_MODEL:-}
      DEEPFIX_LLM_DROP_PARAMS: ${DEEPFIX_LLM_DROP_PARAMS:-1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      # The key the rerank call actually authorizes with. The client reads this
      # first and falls back to COHERE_API_KEY only when it is empty.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COHERE_BASE_URL: ${COHERE_BASE_URL:-https://openrouter.ai/api/v1}
      COHERE_MODEL: ${COHERE_MODEL:-}
      DEEPFIX_LLM_API_KEY: ${DEEPFIX_LLM_API_KEY:-}
      DEEPFIX_LLM_BASE_URL: ${DEEPFIX_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      DEEPFIX_LLM_MODEL_NAME: ${DEEPFIX_LLM_MODEL_NAME:-}
      OPTIMIZATION_MIN_DEV_QUESTIONS: ${OPTIMIZATION_MIN_DEV_QUESTIONS:-50}
      OPTIMIZATION_MIN_NEW_DEV_QUESTIONS: ${OPTIMIZATION_MIN_NEW_DEV_QUESTIONS:-10}
      OPTIMIZATION_MIN_HOLDOUT_QUESTIONS: ${OPTIMIZATION_MIN_HOLDOUT_QUESTIONS:-15}
      OPTIMIZATION_MIN_PRIMARY_DELTA: ${OPTIMIZATION_MIN_PRIMARY_DELTA:-0.025}
      OPTIMIZATION_SECONDARY_TOLERANCE: ${OPTIMIZATION_SECONDARY_TOLERANCE:--0.01}
      OPTIMIZATION_RUN_TIMEOUT_HOURS: ${OPTIMIZATION_RUN_TIMEOUT_HOURS:-3}
      OPTIMIZATION_HEARTBEAT_STALL_MINUTES: ${OPTIMIZATION_HEARTBEAT_STALL_MINUTES:-5}
      OPTIMIZATION_AGENT: ${OPTIMIZATION_AGENT:-hermes}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://hermes:8642}
      # The API posts this id on POST /v1/runs. It must match the sandbox's model.
      HERMES_MODEL: ${HERMES_MODEL:-}
      HERMES_MODEL_PROVIDER: ${HERMES_MODEL_PROVIDER:-openrouter}
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      # Admin Hermes chat. Off by default: nothing listens on 8643 and no chat
      # gateway exists. Typed fields use a non-empty default so an unset .env
      # cannot raise bool_parsing or int_parsing.
      HERMES_CHAT_ENABLED: ${HERMES_CHAT_ENABLED:-false}
      HERMES_CHAT_BASE_URL: ${HERMES_CHAT_BASE_URL:-http://hermes:8643}
      # Empty falls back to HERMES_MODEL, so a default deploy runs one model.
      HERMES_CHAT_MODEL: ${HERMES_CHAT_MODEL:-}
      HERMES_CHAT_API_SERVER_KEY: ${HERMES_CHAT_API_SERVER_KEY:-}
      MLFLOW_HERMES_CHAT_EXPERIMENT: ${MLFLOW_HERMES_CHAT_EXPERIMENT:-deepfix_hermes_chat}
      ADMIN_CHAT_MAX_PROMPT_CHARS: ${ADMIN_CHAT_MAX_PROMPT_CHARS:-48000}
      ADMIN_CHAT_MAX_MESSAGES: ${ADMIN_CHAT_MAX_MESSAGES:-60}
      ADMIN_CHAT_TURN_TIMEOUT_SECONDS: ${ADMIN_CHAT_TURN_TIMEOUT_SECONDS:-300}
      ADMIN_CHAT_DIGEST_MAX_CHARS: ${ADMIN_CHAT_DIGEST_MAX_CHARS:-6000}
      ADMIN_CHAT_MAX_TURNS_PER_WINDOW: ${ADMIN_CHAT_MAX_TURNS_PER_WINDOW:-30}
      ADMIN_CHAT_TURN_WINDOW_SECONDS: ${ADMIN_CHAT_TURN_WINDOW_SECONDS:-300}
      ADMIN_CHAT_MAX_CONCURRENT_TURNS: ${ADMIN_CHAT_MAX_CONCURRENT_TURNS:-2}
      ADMIN_CHAT_ACTION_TTL_SECONDS: ${ADMIN_CHAT_ACTION_TTL_SECONDS:-600}
      ADMIN_CHAT_STEP_TAIL: ${ADMIN_CHAT_STEP_TAIL:-50}
      ADMIN_CHAT_STEP_READ_BYTES: ${ADMIN_CHAT_STEP_READ_BYTES:-65536}
      # Audit rows older than this many days are pruned hourly. 0 keeps them.
      ADMIN_CHAT_AUDIT_RETENTION_DAYS: ${ADMIN_CHAT_AUDIT_RETENTION_DAYS:-14}
    volumes:
      - api_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: deepfix-web
    container_name: deepfix-web
    # No published port: the public domain terminates at Traefik, which proxies
    # to this container on 8080 over its own Docker network. The load-balancer
    # port is a label because there is no published port to infer it from.
    # Dokploy supplies the router and its `Host` rule; see "Published ports" in
    # README.md.
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.web.loadbalancer.server.port=8080"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${WEB_ORIGIN:-http://localhost:8080}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend-api:8000}
      AUTH_DATABASE_PATH: /data/auth.db
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    volumes:
      - web_auth:/data
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  memgraph_lib:
  memgraph_log:
  falkordb_data:
  rustfs_data:
  hermes_data:
  mlflow_artifacts:
  deepfix_tool_data:
  deepfix_server_data:
  web_auth:
  api_data:

# Dokploy's Traefik lives on this network. Only `mlflow` joins it explicitly,
# because its router is declared here rather than created from a Dokploy
# Domain. Every other service is attached by Dokploy itself when an operator
# gives it a Domain. `external: true` means Compose expects the network to
# exist already, which it does on a Dokploy host.
networks:
  dokploy-network:
    external: true
