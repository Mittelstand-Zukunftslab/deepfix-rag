# Local services for DeepFix.
# Credentials are read from .env (see example.env):
#   MEMGRAPH_USERNAME, MEMGRAPH_PASSWORD
#   FALKORDB_PASSWORD
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   OH_SESSION_API_KEY, OH_SECRET_KEY, OPENHANDS_PORT
#   HERMES_DASHBOARD, HERMES_DASHBOARD_BASIC_AUTH_*, API_SERVER_*
#   MLFLOW_BACKEND_STORE_URI,
#   MLFLOW_ALLOWED_HOSTS, MLFLOW_CORS_ALLOWED_ORIGINS
#   DEEPFIX_LLM_API_KEY, DEEPFIX_LLM_BASE_URL, DEEPFIX_LLM_MODEL_NAME, etc.
#   DEEPFIX_SERVER_DATABASE_URL
#   BETTER_AUTH_SECRET, WEB_ORIGIN, API_INTERNAL_URL, AUTH_JWKS_URL, ALLOWED_EMAIL_DOMAINS
#   LLM_API_KEY, EMBEDDING_API_KEY, COHERE_API_KEY
#
#   docker compose up -d

include:
#  - compose.hermes.yml
  - compose.graphdb.yml
  - compose.openhands.yml
  
services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    mem_limit: 1G
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - "http://127.0.0.1:9000/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/opt/mlflow/data
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////opt/mlflow/data/mlflow.db
      MLFLOW_SERVER_ALLOWED_HOSTS: "hermes,openhands,localhost,diagnostic-agent"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://hermes,http://openhands,http://localhost,http://diagnostic-agent"
    mem_limit: 1G
    command: mlflow server --host 0.0.0.0 --port 5000 --artifacts-destination /opt/mlflow/data/artifacts --default-artifact-root mlflow-artifacts:/
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  diagnostic-agent:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    container_name: diagnostic-agent
    ports:
      - "8844:8844"
    environment:
      DEEPFIX_LLM_API_KEY: ${DEEPFIX_LLM_API_KEY:-}
      DEEPFIX_LLM_BASE_URL: ${DEEPFIX_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      DEEPFIX_LLM_MODEL_NAME: ${DEEPFIX_LLM_MODEL_NAME:-qwen/qwen3.8-flash}
      DEEPFIX_LLM_TEMPERATURE: ${DEEPFIX_LLM_TEMPERATURE:-0.7}
      DEEPFIX_LLM_MAX_TOKENS: ${DEEPFIX_LLM_MAX_TOKENS:-8000}
      DEEPFIX_LLM_CACHE: ${DEEPFIX_LLM_CACHE:-1}
      DEEPFIX_LLM_TRACK_USAGE: ${DEEPFIX_LLM_TRACK_USAGE:-1}
      DEEPFIX_SEARCH_PROVIDER: ${DEEPFIX_SEARCH_PROVIDER:-duckduckgo}
      NUM_REASONING_CHAINS: ${NUM_REASONING_CHAINS:-1}
      DEEPFIX_SERVER_DATABASE_URL: ${DEEPFIX_SERVER_DATABASE_URL:-sqlite:////root/.deepfix/deepfix_server.db}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXP_NAME: ${MLFLOW_EXP_NAME:-Deepfix-diagnostic-agent}
      UV_TOOL_BIN_DIR: /root/.local/bin
    volumes:
      - deepfix_tool_data:/root/.local
      - deepfix_server_data:/root/.deepfix
    depends_on:
      mlflow:
        condition: service_healthy
    mem_limit: 1G
    command:
      - /bin/bash
      - -ec
      - |
        export PATH="/root/.local/bin:$${PATH}"
        if ! command -v deepfix-server >/dev/null 2>&1; then
          echo "==> Installing deepfix-server tool via uv..."
          uv tool install --torch-backend cpu "git+https://github.com/delcaux-labs/deepfix.git#subdirectory=packages/deepfix-server"
        fi
        mkdir -p /root/.deepfix
        echo "==> Starting deepfix-server on 0.0.0.0:8844..."
        exec deepfix-server launch -host 0.0.0.0 -port 8844
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - "http://127.0.0.1:8844/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepfix-api
    container_name: deepfix-api
    ports:
      - "8000:8000"
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://web:8080}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://web:8080/api/auth/jwks}
      PRODUCT_DATA_DIR: /data/product
      WORKSPACE_DIR: /data/workspace
      MEMGRAPH_URL: bolt://memgraph:7687
      MEMGRAPH_USERNAME: ${MEMGRAPH_USERNAME:-neo4j}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD:-neo4j}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: ${FALKORDB_PORT:-6379}
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://rustfs:9000}
      S3_URI: ${S3_URI:-s3://deepfix-index/dev}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      DEEPFIX_SERVER_URL: ${DEEPFIX_SERVER_URL:-http://diagnostic-agent:8844}
      OH_SESSION_HOST: ${OH_SESSION_HOST:-http://openhands:8000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-haiku-5.5}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-perplexity/pplx-embed-v1-4b}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_BASE_URL: ${COHERE_BASE_URL:-https://openrouter.ai/api/v1}
      COHERE_MODEL: ${COHERE_MODEL:-cohere/rerank-4-fast}
      DEEPFIX_LLM_API_KEY: ${DEEPFIX_LLM_API_KEY:-}
      DEEPFIX_LLM_BASE_URL: ${DEEPFIX_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      DEEPFIX_LLM_MODEL_NAME: ${DEEPFIX_LLM_MODEL_NAME:-openai/gpt-6-luna-pro}
    volumes:
      - api_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: deepfix-web
    container_name: deepfix-web
    ports:
      - "8080:8080"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${WEB_ORIGIN:-http://localhost:8080}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend-api:8000}
      AUTH_DATABASE_PATH: /data/auth.db
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    volumes:
      - web_auth:/data
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  memgraph_lib:
  memgraph_log:
  falkordb_data:
  rustfs_data:
  hermes_data:
  openhands_data:
  mlflow_artifacts:
  deepfix_tool_data:
  deepfix_server_data:
  web_auth:
  api_data:
