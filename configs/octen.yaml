version: "1.0"

chunking:
  strategy: recursive
  size: 512
  overlap: 64

embedding:
  model: octen-embedding-8b
  provider: aisc
  batch_size: 32

retrieval:
  backend: hybrid
  top_k: 10
  hybrid_alpha: 0.5

rerank:
  enabled: false
  model: rerank-english-v3.0
  top_n: 5

generation:
  model: openai/openrouter/qwen/qwen3.8-27b
  provider: hpi
  temperature: 0.0
  max_tokens: 1024
