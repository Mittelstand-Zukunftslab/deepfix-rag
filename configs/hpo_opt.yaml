version: "1.0"

base_config: configs/baseline_final.yaml

study_name: legal_rag_bench_hybrid_querytime
storage_uri: "sqlite:///C:/Users/agrim/AppData/Local/Temp/deepfixopt/hpo_study.db"
n_trials: 12
tune_chunking: false
retrieval_only: true

metrics:
  retrieval_only_targets:
    - ndcg
    - recall
  aliases:
    recall:
      - recall
      - R@5
    ndcg:
      - ndcg
      - nDCG@5

search_space:
  hybrid:
    top_k_min: 5
    top_k_max: 50
    bm25_k1_min: 0.5
    bm25_k1_max: 3.0
    bm25_b_min: 0.1
    bm25_b_max: 1.0
    dense_weight_min: 0.0
    dense_weight_max: 1.0
    fusion_modes:
      - reciprocal_rerank
      - relative_score
      - dist_based_score
      - simple
