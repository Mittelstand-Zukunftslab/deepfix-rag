version: '1.0'
chunking:
  strategy: recursive
  size: 1024
  overlap: 64
  semantic_buffer_size: 1
  semantic_breakpoint_percentile: 95
  hierarchical_chunk_sizes: null
embedding:
  batch_size: 32
retrieval:
  backend: hybrid
  vector_store: lancedb
  graph_store: none
  lancedb_table_name: documents
  lancedb_index_dir: indexes/champion
  top_k: 50
  fusion_mode: reciprocal_rerank
  query_expansion_num: 1
  query_gen_prompt: 'You are a helpful assistant that generates multiple search queries
    based on a single input query. Generate {num_queries} search queries, one on each
    line, related to the following input query:

    Query: {query}

    Queries:

    '
  dense_weight: 0.5
  bm25_weight: 0.5
  graph_weight: 0.0
  bm25_k1: 1.5
  bm25_b: 0.75
  graph_extraction_schema: default
  graph_max_paths_per_chunk: 5
  graph_traversal_hops: 2
  bit_width: 4
  language: german
  load_if_exists: true
rerank:
  enabled: true
  top_n: 5
  # Relevance floor, on the reranker's 0..1 relevance_score scale. Calibrated
  # 2026-11-15 with the real Cohere scores that OpenRouter returns for
  # cohere/rerank-4-fast on the live biology corpus: in-corpus questions put
  # their best passage at 0.658-0.910, off-corpus questions topped out at
  # 0.091-0.179, and biology-adjacent questions the corpus does not cover landed
  # at 0.46-0.54. 0.3 sits above every off-corpus hit and below the adjacent
  # band, so a covered question keeps its passages, an adjacent-but-unanswered
  # one still shows what was found, and an unrelated one returns none. This
  # replaced the earlier 0.2, which was measured on Bundestag chunks on a scale
  # that never occurred on the live corpus. Re-measure if COHERE_MODEL changes;
  # the absolute scale is model-specific.
  min_relevance_score: 0.3
generation:
  temperature: 0.0
  max_tokens: 4096
  system_prompt: null
  response_synthesizer: simple_summarize
data:
  path_or_repo: HF:wirthual/dip-bundestag
  split: train
  limit: 100
  source_type: huggingface
  enable_embedding_pca: true
  embedding_pca_components: 200
eval:
  retrieval_metrics:
  - ndcg
  - recall
  generation_metrics:
  - faithfulness
  - context_precision
  - context_recall
  - answer_relevancy
  - contextual_relevancy
  threshold: 0.7
  concurrency: 5
  cutoff_k: 5
retrieval_only: false
