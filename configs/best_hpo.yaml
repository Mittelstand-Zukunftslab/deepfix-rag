version: '1.0'
chunking:
  strategy: recursive
  size: 1024
  overlap: 64
  semantic_buffer_size: 1
  semantic_breakpoint_percentile: 95
  hierarchical_chunk_sizes: null
embedding:
  batch_size: 32
retrieval:
  backend: hybrid
  vector_store: lancedb
  graph_store: none
  lancedb_table_name: documents
  lancedb_index_dir: data/deepfix_opt_index
  top_k: 15
  fusion_mode: dist_based_score
  dense_weight: 0.5578843682586203
  bm25_weight: 0.5
  graph_weight: 0.0
  bm25_k1: 2.1686426440307254
  bm25_b: 0.5160539676253955
  graph_extraction_schema: default
  graph_max_paths_per_chunk: 5
  graph_traversal_hops: 2
  bit_width: 4
  language: english
  load_if_exists: true
rerank:
  enabled: false
  top_n: 5
generation:
  temperature: 0.0
  max_tokens: 4096
  system_prompt: null
  response_synthesizer: simple_summarize
data:
  path_or_repo: HF:isaacus/legal-rag-bench
  split: train
  limit: 12
  source_type: huggingface
  enable_embedding_pca: true
  embedding_pca_components: 200
eval:
  retrieval_metrics:
  - ndcg
  - recall
  generation_metrics:
  - faithfulness
  - context_precision
  - context_recall
  - answer_relevancy
  - contextual_relevancy
  threshold: 0.7
  concurrency: 5
  cutoff_k: 5
retrieval_only: true
