version: '1.0'
chunking:
  strategy: recursive
  size: 1024
  overlap: 64
  semantic_buffer_size: 1
  semantic_breakpoint_percentile: 95
  hierarchical_chunk_sizes: null
embedding:
  batch_size: 32
retrieval:
  backend: graph
  vector_store: lancedb
  graph_store: falkordb
  lancedb_table_name: documents
  lancedb_index_dir: indexes/champion
  top_k: 50
  fusion_mode: reciprocal_rerank
  query_expansion_num: 1
  query_gen_prompt: 'You are a helpful assistant that generates multiple search queries
    based on a single input query. Generate {num_queries} search queries, one on each
    line, related to the following input query:

    Query: {query}

    Queries:

    '
  dense_weight: 0.5
  bm25_weight: 0.5
  graph_weight: 0.0
  bm25_k1: 1.5
  bm25_b: 0.75
  graph_extraction_schema: entity_relationship
  graph_max_paths_per_chunk: 5
  graph_traversal_hops: 2
  bit_width: 4
  language: german
  load_if_exists: true
rerank:
  enabled: true
  top_n: 5
generation:
  temperature: 0.0
  max_tokens: 4096
  system_prompt: null
  response_synthesizer: simple_summarize
data:
  path_or_repo: HF:wirthual/dip-bundestag
  split: train
  limit: 100
  source_type: huggingface
  enable_embedding_pca: true
  embedding_pca_components: 200
eval:
  retrieval_metrics:
  - ndcg
  - recall
  generation_metrics:
  - faithfulness
  - context_precision
  - context_recall
  - answer_relevancy
  - contextual_relevancy
  threshold: 0.7
  concurrency: 5
  cutoff_k: 5
retrieval_only: false
